name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ponte:
    name: Ponte (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo test
      - run: cargo clippy --all-targets

  interface:
    name: Interface (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcs-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gcs-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  bordo:
    name: Bordo (ROS 2 Jazzy)
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y ros-jazzy-geographic-msgs
      - name: Compilar e testar
        shell: bash
        working-directory: ros2_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose

  desktop:
    name: App desktop (Tauri)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bridge
            desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Interface (embutida no app)
        working-directory: gcs-web
        run: npm ci && npm run build
      - name: Ponte e simulador para empacotar
        run: node desktop/scripts/sidecars.mjs
      - name: Testes do app
        working-directory: desktop/src-tauri
        run: cargo test
