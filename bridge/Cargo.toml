[package]
name = "aracua-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
mavlink = { version = "0.18", features = ["mav2-message-extensions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "aracua-bridge"
path = "src/main.rs"

[[bin]]
name = "fake-vehicle"
path = "src/bin/fake_vehicle.rs"
