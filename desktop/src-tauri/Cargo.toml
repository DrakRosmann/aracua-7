[package]
name = "aracua-desktop"
version = "0.4.0"
description = "Aracuã-7 — estação de solo para desktop"
authors = ["Guilherme de Lima Rosman"]
license = "MIT"
edition = "2021"

[lib]
name = "aracua_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.10"
